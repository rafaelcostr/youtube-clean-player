<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <title>YouTube Clean Player</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Clean Player</h1>
      <label class="toggle">
        <input type="checkbox" id="enabled" checked>
        <span>Ativo</span>
      </label>
      <label class="toggle">
        <input type="checkbox" id="autoSkip" checked>
        <span>Acelerar anúncios</span>
      </label>
      <label class="toggle">
        <input type="checkbox" id="autoClick">
        <span>Clicar em Pular</span>
      </label>
      <label class="speed">
        <span>Velocidade</span>
        <select id="speed">
          <option value="1.25">1.25x</option>
          <option value="1.5">1.5x</option>
          <option value="2" selected>2x</option>
          <option value="3">3x</option>
          <option value="4">4x</option>
        </select>
      </label>
      <p class="hint">Silencia anúncios sempre. A velocidade só é usada quando acelerar estiver ativo.</p>
      <p class="hint warn">Clicar em Pular pode acionar o bloqueio do YouTube; use só para testar.</p>
      <p class="status" id="statusText">Ativo no YouTube</p>
      <dl>
        <div>
          <dt>Anúncios pulados</dt>
          <dd id="skipped">0</dd>
        </div>
      </dl>
      <p class="last" id="lastAction">Abra um vídeo do YouTube para testar.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
