<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <title>YouTube Clean Player</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Clean Player</h1>
      <label class="toggle">
        <input type="checkbox" id="enabled" checked>
        <span>Bloqueio ativo</span>
      </label>
      <p class="status" id="statusText">Ativo no YouTube</p>
      <dl>
        <div>
          <dt>Anúncios pulados</dt>
          <dd id="skipped">0</dd>
        </div>
        <div>
          <dt>Promoções ocultadas</dt>
          <dd id="hidden">0</dd>
        </div>
        <div>
          <dt>Regras de rede</dt>
          <dd id="blocked">—</dd>
        </div>
      </dl>
      <p class="last" id="lastAction">Abra um vídeo do YouTube para testar.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
